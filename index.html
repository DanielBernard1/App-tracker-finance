<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Finance Tracker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 id="app-title" data-i18n="appTitle">Finance Tracker</h1>
    <div class="topbar-actions">
      <select id="theme-select" aria-label="Theme"></select>
      <select id="lang-select" aria-label="Language">
        <option value="en">EN</option>
        <option value="zh">中文</option>
      </select>
      <button id="settings-btn" class="icon-btn" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main id="view" class="view"><!-- rendered by app.js --></main>

  <!-- Modal host -->
  <div id="modal-root"></div>

  <script src="i18n.js"></script>
  <script src="store.js"></script>
  <script src="projection.js"></script>
  <script src="chart.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
